name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
        env: { DATABASE_URL: postgresql://user:password@localhost:5432/wanderly }
      - run: pnpm api:validate
      - run: pnpm security:secrets
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @wanderly/mobile run smoke:check
